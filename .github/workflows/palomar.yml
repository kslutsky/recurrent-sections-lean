name: Palomar package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: '2'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: 'false'
          use-mathlib-cache: 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.0'
      - name: Install metadata validators
        run: |
          python3 -m venv .lake/palomar-venv
          .lake/palomar-venv/bin/python -m pip install -r scripts/requirements-palomar.txt
      - name: Install Linux syscall-filter headers
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      - name: Build pinned verification tools
        run: python3 scripts/palomar_tools.py
      - name: Build and audit the complete proof library
        run: python3 scripts/check.py
      - name: Validate, compare, and replay with both kernels
        run: .lake/palomar-venv/bin/python scripts/palomar.py all --record
      - name: Preserve local-check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: palomar-linux-checks
          path: |
            verification/palomar-linux/
            .lake/palomar-results/linux/
          include-hidden-files: true
          if-no-files-found: warn
