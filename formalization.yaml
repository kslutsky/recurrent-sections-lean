status:
  scope: >-
    Five complete Comparator statements: polynomial-growth and virtual-nilpotence
    characterizations for arbitrary and free standard Borel actions, and the
    single-sequence obstruction in a free probability-preserving action.
    No mathematical theorem input remains unproved. Integer word radii are
    used. Recurrence holds at every point. The single-sequence theorem does
    not require complete sections or a standard Borel space. No subexponential
    converse, hyperfiniteness theorem, locally compact generalization, explicit
    Bass–Guivarc'h degree formula, or positive volume asymptotic is asserted.
  # Counts exclude the five deliberate theorem holes in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
    - method: manual
      tool_setup: Human research direction, problem formulation, and maintenance by Konstantin Slutsky.
    - method: agent
      framework: OpenAI Codex
      models: []
      tool_setup: >-
        Substantial AI assistance in mathematical argument development,
        literature inspection, Lean definitions and proofs, debugging,
        documentation, initial separate-agent reviews, and repository tooling.
      prompting_notes: >-
        Iterative user-directed formalization and compiler-guided proof repair.
        Exact per-session model variants and complete prompt or cost logs were
        not consistently retained; no such records are reconstructed here.
  notes: >-
    ACKNOWLEDGEMENTS.md and AUTHORS.md give the production account. Hill's
    imported proofs retain his authorship. AI systems are credited as tools,
    not project authors or responsible maintainers.
review:
  status: self-assessed
  notes: >-
    Local Lean builds and recursive axiom audits cover the completed proof
    development. Three separately tasked Codex agents reviewed only the
    initial repository snapshot; reviews/ records their scope and findings.
    They are not independent human peer review and do not cover the subsequent
    toolkit and volume additions. Palomar preparation checks are documented
    in PALOMAR.md and verification/. No outside human review, Palomar review,
    certification of novelty, or source-author endorsement is claimed.
fidelity:
  divergences: >-
    Marks–Unger's free integer-lattice construction is generalized to all
    finitely generated groups of polynomial growth and arbitrary stabilizers.
    The growth obstructions and resulting characterizations are local results;
    publication priority remains unclaimed. The group-volume formalization
    gives an existential matching exponent, not the Bass–Guivarc'h rank formula
    or Breuillard's stronger asymptotic theorem. The precise theorem hypotheses
    and scopes are explicit in Challenge.lean and RESULTS.md.
alignment:
  namespace: PalomarRecurrence
  statements:
    - source: Generalized recurrent-section construction and local growth obstruction
      lean: PalomarRecurrence.recurrence_iff_polynomialGrowth
      module: Solution
      status: proved
    - source: Recurrence characterization combined with the Gromov–Wolf equivalence
      lean: PalomarRecurrence.recurrence_iff_virtuallyNilpotent
      module: Solution
      status: proved
    - source: Free-action specialization and the Bernoulli test-action obstruction
      lean: PalomarRecurrence.freeRecurrence_iff_polynomialGrowth
      module: Solution
      status: proved
    - source: Free-action characterization combined with the Gromov–Wolf equivalence
      lean: PalomarRecurrence.freeRecurrence_iff_virtuallyNilpotent
      module: Solution
      status: proved
    - source: Local packing and Borel–Cantelli obstruction for one recurrent sequence
      lean: PalomarRecurrence.one_sequence_implies_subexponentialGrowth
      module: Solution
      status: proved
